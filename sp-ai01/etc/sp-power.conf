# /etc/sp-power.conf - the one power / clock / fan / thermal config for sp-ai01 (read by sp-power.service).
# Apply changes:  sudo systemctl reload sp-power      Status:  sp-power status
# Thermal actions only ever LOWER limits. Remove a line to fall back to the built-in default.

# --- CPU (sockets 0/1). CPU0 runs ~10 C hotter (needs a repaste): keep it low.
CPU_NO_TURBO=1
CPU0_W=50                 # RAPL package-0 cap, long + short term
CPU1_W=85                 # RAPL package-1 cap
CPU_HOT_C=85              # socket at/above this -> its cap drops to CPU_HOT_PCT %
CPU_RESUME_C=78
CPU_HOT_PCT=75            # 50 -> 37 W, 85 -> 63 W while hot

# --- CMP 170HX power (all CMPs, found by PCI ID)
CMP_POWER_W=165           # chosen 2026-10-01 from the burn tests (LLM serving averages ~134 W)
CMP_HOT_C=83              # core or HBM at/above -> CMP_HOT_W on that card
CMP_RESUME_C=75
CMP_HOT_W=125

# --- CMP boot stages. 'safe' from boot; 'perf' at uptime CMP_PERF_AFTER_S unless the boot-loop guard
# tripped (/var/lib/sp-cmp-perf/tripped; re-enable with: sudo sp-power reset-perf).
# The perf values were qualified on the OLD 20c2 cards (two back-to-back KLD passes). The 2082 card
# installed 2026-11-05 is NOT qualified for them: keep the guard tripped until it is.
CMP_SAFE_OFFSET=0
CMP_SAFE_CLK=1200
CMP_PERF_OFFSET=150
CMP_PERF_CLK=1695
CMP_PERF_AFTER_S=300
CMP_STABLE_AFTER_S=2100   # perf ran this long (35 min uptime) -> guard marker cleared

# --- CMP clock governor (batch-1 decode: floor 1600 gave +11% tok/s on 2026-10-06)
CMP_BOOST_FLOOR=1600
CMP_IDLE_FLOOR=210
CMP_UTIL_ON=5             # % util on any CMP = busy
CMP_HOLD_S=30             # idle this long -> floor released
CMP_SOFT_C=78             # core/HBM at/above -> floor released until below CMP_SOFT_RESUME_C
CMP_SOFT_RESUME_C=73

# --- GPU fans (only cards with their own fan; chassis fans are not controllable)
FAN_IDLE_PCT=30
FAN_HOT_GPU_C=62          # that GPU at/above -> driver auto curve
FAN_HOT_GPU_W=80
FAN_HOT_CPU_C=75          # hottest CPU at/above -> auto curve on every GPU fan

# --- loop timing / PSU log
FAST_S=0.25
SLOW_S=5
REASSERT_S=60
PSU_LOG_S=60
PSU_LIMIT_C=80
